<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/cse110.css">
    <link rel="website icon" type="png" href="../image/360-logo.png">
    <title>CSE360</title>
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.20/dist/lenis.css">
</head>

<body>

    <div id="header-component"></div>


    <div id=header class="h1-con">
        <h1>CSE360</h1>
    </div>

    <div class="h2-con">
        <h2>Computer Interfacing</h2>
    </div>

    <div class="space"></div>
    <div class="extra-space"></div>

    <!-- =============================================================================================================== -->
    <div class="button-container">
        <div class="folder-box"
            onclick="openFolder('https://drive.google.com/drive/folders/1YFXvNDuZJmAeQMRyagn88NtAwBl7c1k9?usp=drive_link', '_blank')">
            <span class="folder-icon">&#128193;</span>
            <h3>Theory Assignment</h3>
        </div>

        <div class="folder-box"
            onclick="openFolder('https://drive.google.com/drive/folders/1-TSL2CaCcAp1wrW4aljLQQ11oWZ3Wczj?usp=drive_link', '_blank')">
            <span class="folder-icon">&#128193;</span>

        </div>

        <div class="folder-box"
            onclick="openFolder('https://drive.google.com/drive/folders/1DCtMr50LSeOiftBcTtaWn0lF7uqfR2eS?usp=drive_link', '_blank')">

    </div>


    <div class="button-container">
        <div class="folder-box"
            onclick="openFolder('https://drive.google.com/drive/folders/1tABP-2K7iLV6JkDS5kb49Wu_E3JNEK7m?usp=drive_link', '_blank')">
            <span class="folder-icon">&#128193;</span>

        </div>

        <div class="folder-box"
            onclick="openFolder('https://drive.google.com/drive/folders/12K15ayuIIAoR29935CWl6GMLedB-Y7hh?usp=sharing', '_blank')">
            <span class="folder-icon">&#128193;</span>
            <h3>FNK Slide</h3>
        </div>
        
        <div class="folder-box"
            onclick="openFolder('https://drive.google.com/drive/folders/1-l2enIAz6pDgT7UNxQycNBGmWa6aFH2z?usp=drive_link', '_blank')">
            <span class="folder-icon">&#128193;</span>
            <h3>Mid Exam</h3>
        </div>
        
    </div>
    
    
    <div class="button-container">
        <div class="folder-box"
            onclick="openFolder('https://drive.google.com/drive/folders/1DTaFZgj4CkEnAVD22wNEe9Un8HK4DgtS?usp=drive_link', '_blank')">
            <span class="folder-icon">&#128193;</span>
            <h3>Final Exam</h3>
        </div>

            onclick="openFolder('https://youtube.com/playlist?list=PLL6TRCyswkrs0h9IzTZrIZUzJZEmQ_nHN&si=oLht3l9Qrh-0qG63', '_blank')">
            <span class="folder-icon">&#9654;</span>
            <h3>YT Playlist (FNK)</h3>
        </div>
    </div>

    <!-- ========  footer  ================ -->
    <div class="extra-space"></div>

    <div id="footer-component"></div>
    <!-- ========  footer  ================ -->


    <script>
        function openFolder(link, target) {
            window.open(link, target);
        }
    </script>
    <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
    <script src="../js/lenis_init.js"></script>
    <script src="../js/components.js"></script>

</html>
